<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Alex Morgan to discuss an accessible web design project.">
  <meta name="robots" content="index, follow">
  <title>Contact | Alex Morgan</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header"><div class="container header-content">
    <a class="brand" href="index.html" aria-label="Alex Morgan home">Alex Morgan</a>
    <nav aria-label="Primary navigation"><ul class="nav-list"><li><a href="index.html">Home</a></li><li><a href="projects.html">Projects</a></li><li><a aria-current="page" href="contact.html">Contact</a></li></ul></nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span aria-hidden="true">◐</span><span class="theme-label">Theme</span></button>
  </div></header>
  <main id="main-content" class="container">
    <header class="page-intro"><h1>Let’s work together</h1><p>Tell me about your project. Fields marked “required” must be completed.</p></header>
    <form action="#" method="post" aria-describedby="form-help">
      <p id="form-help">I will reply within two business days.</p>
      <div class="form-field"><label for="name">Name <span aria-hidden="true">*</span><span class="sr-only">required</span></label><input id="name" name="name" type="text" autocomplete="name" required aria-required="true"></div>
      <div class="form-field"><label for="email">Email <span aria-hidden="true">*</span><span class="sr-only">required</span></label><input id="email" name="email" type="email" autocomplete="email" required aria-required="true"></div>
      <div class="form-field"><label for="subject">Subject</label><input id="subject" name="subject" type="text"></div>
      <div class="form-field"><label for="message">Message <span aria-hidden="true">*</span><span class="sr-only">required</span></label><textarea id="message" name="message" rows="7" required aria-required="true"></textarea></div>
      <button class="button" type="submit">Send message</button>
    </form>
  </main>
  <footer class="site-footer"><div class="container"><p>© 2026 Alex Morgan. Built with accessibility in mind.</p></div></footer>
</body>
</html>
