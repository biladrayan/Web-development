<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A client-side task manager with filtering and local data persistence.">
  <title>Focus List | Task Manager</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">Your day, organized</p>
      <h1>Focus List</h1>
      <p class="intro">Add a task, make progress, and pick up right where you left off.</p>
    </header>

    <section class="task-panel" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading" class="sr-only">Your tasks</h2>
      <form id="task-form" class="task-form">
        <label class="sr-only" for="new-task">New task</label>
        <input id="new-task" name="task" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off" required>
        <button type="submit">Add task</button>
      </form>

      <div class="task-toolbar">
        <p id="task-summary" aria-live="polite">0 tasks left</p>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter is-selected" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">No tasks here yet. Add one above.</p>
      <button id="clear-completed" class="clear-button" type="button">Clear completed</button>
    </section>
  </main>
</body>
</html>
